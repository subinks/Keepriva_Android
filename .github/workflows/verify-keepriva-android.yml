name: Keepriva Android Build and Real Screenshot Verification

on:
  workflow_dispatch:
  push:
    branches:
      - initial_commit
      - ui_enhancement

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout initial_commit
        uses: actions/checkout@v4
        with:
          ref: initial_commit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36 build components
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Allow screenshots only in this CI debug build
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/example/privatevault/ScreenSecurityManager.java")
          text = p.read_text(encoding="utf-8")

          activity_pattern = re.compile(
              r'(public static void protect\(Activity activity\) \{\s*'
              r'if \(activity == null\) return;\s*)'
              r'(protectWindow\(activity\.getWindow\(\)\);)',
              re.MULTILINE
          )

          dialog_pattern = re.compile(
              r'(public static void protect\(Dialog dialog\) \{\s*'
              r'if \(dialog == null\) return;\s*)'
              r'(protectWindow\(dialog\.getWindow\(\)\);)',
              re.MULTILINE
          )

          text, activity_count = activity_pattern.subn(
              r'\1'
              '// CI visual verification only. This edit exists only in the disposable CI workspace.\n'
              '        if (BuildConfig.DEBUG) return;\n'
              r'        \2',
              text,
              count=1
          )

          text, dialog_count = dialog_pattern.subn(
              r'\1'
              '// CI visual verification only.\n'
              '        if (BuildConfig.DEBUG) return;\n'
              r'        \2',
              text,
              count=1
          )

          if activity_count != 1:
              raise SystemExit(
                  f"Expected to patch protect(Activity) exactly once; patched {activity_count}"
              )

          if dialog_count != 1:
              raise SystemExit(
                  f"Expected to patch protect(Dialog) exactly once; patched {dialog_count}"
              )

          p.write_text(text, encoding="utf-8")
          print("Temporary CI screenshot patch applied successfully.")

      - name: Verify manifest has no INTERNET permission
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number \
              'android.permission.INTERNET' \
              app/src/main/AndroidManifest.xml app/src/main/res 2>/dev/null; then
            echo "ERROR: INTERNET permission found."
            exit 1
          fi

          echo "PASS: no INTERNET permission found."

      - name: Compile, lint, unit test, and build APKs
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          gradle \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            --stacktrace

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk

          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' | head -n 1)"
          test -n "$TEST_APK"
          test -f "$TEST_APK"

          echo "Debug APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "Instrumentation APK:"
          ls -lh "$TEST_APK"

      - name: Create verification output directories
        shell: bash
        run: |
          mkdir -p \
            ci-artifacts/screenshots \
            ci-artifacts/ui \
            ci-artifacts/apk \
            ci-artifacts/logs \
            ci-artifacts/reports

      - name: Enable and verify KVM acceleration
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner kernel: $(uname -a)"
          echo "CPU virtualization flags:"
          grep -E -m1 -o 'vmx|svm' /proc/cpuinfo || true

          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm is not available on this runner."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Prepare emulator verification script
        shell: bash
        run: |
          cat > ci-emulator-verification.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          PACKAGE="com.example.privatevault.debug"
          ACTIVITY="com.example.privatevault.MainActivity"
          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' | head -n 1)"

          require_package() {
            if ! adb shell pm path "$PACKAGE" 2>/dev/null | grep -q '^package:'; then
              echo "ERROR: target package $PACKAGE is not installed."
              exit 1
            fi
          }

          dump_ui() {
            local remote="$1"
            local local_file="$2"

            adb shell uiautomator dump "$remote" >/dev/null
            adb pull "$remote" "$local_file" >/dev/null
            test -s "$local_file"
          }

          echo "=== Emulator / ADB diagnostics ==="
          adb version
          adb devices -l
          adb wait-for-device
          echo "boot_completed=$(adb shell getprop sys.boot_completed || true)"
          echo "device=$(adb shell getprop ro.product.device || true)"
          echo "sdk=$(adb shell getprop ro.build.version.sdk || true)"

          echo "=== Keep emulator awake and deterministic ==="
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell input keyevent 82 || true
          adb shell svc power stayon true || true
          adb shell settings put global stay_on_while_plugged_in 3 || true
          adb shell settings put system screen_off_timeout 2147483647 || true
          adb shell dumpsys deviceidle disable || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
          sleep 2

          echo "=== Install debug APK ==="
          adb install -r "$APP_APK"
          require_package

          echo "=== Run complete Android instrumentation suite ==="
          gradle :app:connectedDebugAndroidTest --stacktrace

          echo "PASS: normal instrumentation suite completed."

          echo "=== Restore target app after Gradle instrumentation cleanup ==="
          adb install -r "$APP_APK"
          require_package

          echo "=== Reset app before screenshot verification ==="
          adb shell pm clear "$PACKAGE"
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true

          echo "=== Launch fresh Keepriva setup screen ==="
          adb shell am start -W -n "$PACKAGE/$ACTIVITY"
          sleep 3

          adb exec-out screencap -p > ci-artifacts/screenshots/01-fresh-install-setup.png
          dump_ui \
            /sdcard/keepriva-ui.xml \
            ci-artifacts/ui/01-fresh-install-ui.xml

          grep -q "Create Keepriva" ci-artifacts/ui/01-fresh-install-ui.xml
          grep -q "Create encrypted vault" ci-artifacts/ui/01-fresh-install-ui.xml

          echo "PASS: fresh-install setup UI verified."

          echo "=== Create deterministic screenshot-test vault ==="
          python3 - <<'PY'
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET

          PASSWORD = "KeeprivaTest123"

          def adb(*args, check=True):
              return subprocess.run(
                  ["adb", *args],
                  check=check,
                  text=True,
                  capture_output=True
              )

          def dump():
              adb("shell", "uiautomator", "dump", "/sdcard/window.xml", check=False)
              result = adb("shell", "cat", "/sdcard/window.xml", check=False)
              if not result.stdout.strip():
                  raise RuntimeError("UI hierarchy dump is empty")
              return ET.fromstring(result.stdout)

          def center(bounds):
              nums = [int(x) for x in re.findall(r"\d+", bounds)]
              if len(nums) != 4:
                  raise RuntimeError(f"Unexpected bounds: {bounds}")
              x1, y1, x2, y2 = nums
              return (x1 + x2) // 2, (y1 + y2) // 2

          def tap_node(node):
              x, y = center(node.attrib["bounds"])
              adb("shell", "input", "tap", str(x), str(y))
              time.sleep(0.5)

          root = dump()
          edits = [
              n for n in root.iter("node")
              if n.attrib.get("class") == "android.widget.EditText"
          ]

          if len(edits) < 2:
              raise RuntimeError(
                  "Expected at least two password fields on setup screen; "
                  f"found {len(edits)}"
              )

          for node in edits[:2]:
              tap_node(node)
              adb("shell", "input", "text", PASSWORD)
              time.sleep(0.5)

          root = dump()
          create_button = next(
              (
                  n for n in root.iter("node")
                  if "Create encrypted vault" in n.attrib.get("text", "")
              ),
              None
          )

          if create_button is None:
              raise RuntimeError("Create encrypted vault button was not found")

          tap_node(create_button)
          time.sleep(3)
          PY

          adb exec-out screencap -p > ci-artifacts/screenshots/02-vault-home.png
          dump_ui \
            /sdcard/keepriva-home-ui.xml \
            ci-artifacts/ui/02-vault-home-ui.xml

          grep -q "Search title, username, phone, website or notes" \
            ci-artifacts/ui/02-vault-home-ui.xml

          echo "PASS: vault home UI verified."

          echo "=== Capture real master-password unlock screen ==="
          adb shell am force-stop "$PACKAGE"
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
          adb shell am start -W -n "$PACKAGE/$ACTIVITY"
          sleep 3

          adb exec-out screencap -p > ci-artifacts/screenshots/03-real-unlock-screen.png
          dump_ui \
            /sdcard/keepriva-unlock-ui.xml \
            ci-artifacts/ui/03-real-unlock-ui.xml

          grep -q 'content-desc="Master password"' \
            ci-artifacts/ui/03-real-unlock-ui.xml
          grep -q 'content-desc="Unlock with master password"' \
            ci-artifacts/ui/03-real-unlock-ui.xml

          echo "PASS: master-password unlock UI verified."

          # -----------------------------------------------------------------
          # Optional emulator-biometric diagnostic
          #
          # Biometric enrollment is a property of the emulator/device, not the
          # Keepriva build. `adb emu finger touch` only authenticates an already
          # enrolled virtual finger; it does not enroll one. Therefore this
          # diagnostic MUST NOT turn a valid Android build red.
          #
          # If the emulator supports/enables it, we capture and verify the real
          # biometric-enabled Keepriva screen. Otherwise we preserve the log,
          # UI dump, and screenshot for inspection and continue successfully.
          # -----------------------------------------------------------------

          echo "=== Optional emulator biometric diagnostic ==="

          {
            echo "=== package features ==="
            adb shell pm list features || true
            echo
            echo "=== biometric service ==="
            adb shell dumpsys biometric || true
            echo
            echo "=== fingerprint service ==="
            adb shell dumpsys fingerprint || true
            echo
            echo "=== fingerprint command help ==="
            adb shell cmd fingerprint help || true
          } > ci-artifacts/logs/biometric-environment.txt 2>&1

          adb shell locksettings set-pin 0000 \
            >> ci-artifacts/logs/biometric-environment.txt 2>&1 || true

          if [ -n "$TEST_APK" ] && [ -f "$TEST_APK" ]; then
            adb install -r "$TEST_APK" \
              >> ci-artifacts/logs/biometric-environment.txt 2>&1 || true

            INSTRUMENTATION="$(
              adb shell pm list instrumentation \
                | tr -d '\r' \
                | grep "$PACKAGE" \
                | head -n 1 \
                | sed -E 's/^instrumentation:([^ ]+).*$/\1/' \
                || true
            )"

            if [ -n "$INSTRUMENTATION" ]; then
              echo "Using instrumentation: $INSTRUMENTATION" \
                >> ci-artifacts/logs/biometric-environment.txt

              set +e
              adb shell am instrument -w -r \
                -e class com.example.privatevault.KeeprivaBiometricCiTest \
                -e keeprivaBiometricCi 1 \
                "$INSTRUMENTATION" \
                > ci-artifacts/logs/biometric-test.log 2>&1 &
              BIO_TEST_PID=$!

              for i in $(seq 1 20); do
                adb emu finger touch 1 >/dev/null 2>&1 || true
                sleep 1
              done

              wait "$BIO_TEST_PID"
              BIO_RESULT=$?
              set -e

              echo "Biometric instrumentation exit code: $BIO_RESULT" \
                >> ci-artifacts/logs/biometric-environment.txt
            else
              echo "No Keepriva instrumentation runner was registered." \
                >> ci-artifacts/logs/biometric-test.log
            fi
          else
            echo "androidTest APK unavailable." \
              > ci-artifacts/logs/biometric-test.log
          fi

          adb shell am force-stop "$PACKAGE" || true
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell am start -W -n "$PACKAGE/$ACTIVITY" || true
          sleep 3

          adb exec-out screencap -p \
            > ci-artifacts/screenshots/04-biometric-diagnostic.png || true

          adb shell uiautomator dump /sdcard/keepriva-biometric-ui.xml \
            >/dev/null 2>&1 || true
          adb pull \
            /sdcard/keepriva-biometric-ui.xml \
            ci-artifacts/ui/04-biometric-diagnostic-ui.xml \
            >/dev/null 2>&1 || true

          if [ -s ci-artifacts/ui/04-biometric-diagnostic-ui.xml ] \
             && grep -q 'content-desc="Unlock Keepriva with biometrics"' \
                  ci-artifacts/ui/04-biometric-diagnostic-ui.xml; then
            cp \
              ci-artifacts/screenshots/04-biometric-diagnostic.png \
              ci-artifacts/screenshots/04-biometric-unlock-screen.png

            cp \
              ci-artifacts/ui/04-biometric-diagnostic-ui.xml \
              ci-artifacts/ui/04-biometric-unlock-ui.xml

            echo "PASS: real biometric-enabled Keepriva UI verified." \
              | tee -a ci-artifacts/logs/biometric-environment.txt
          else
            echo "NOTICE: emulator has no usable enrolled biometric for Keepriva." \
              | tee -a ci-artifacts/logs/biometric-environment.txt

            echo "NOTICE: biometric diagnostic is non-blocking; main build remains valid." \
              | tee -a ci-artifacts/logs/biometric-environment.txt
          fi

          echo "=== Final package / log diagnostics ==="
          adb shell dumpsys package "$PACKAGE" \
            > ci-artifacts/logs/package-dump.txt || true
          adb logcat -d \
            > ci-artifacts/logs/logcat.txt || true

          echo "PASS: strict Keepriva build/test/screenshot verification completed."
          SCRIPT

          chmod +x ci-emulator-verification.sh
          bash -n ci-emulator-verification.sh

      - name: Boot emulator, run strict tests, and capture real screenshots
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 180
          emulator-options: >-
            -no-window
            -no-snapshot
            -wipe-data
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: |
            bash ci-emulator-verification.sh

      - name: Copy APK into artifact folder
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts/apk

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp \
              app/build/outputs/apk/debug/app-debug.apk \
              ci-artifacts/apk/Keepriva-debug.apk
          fi

      - name: Copy lint and test reports when available
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts/reports

          if [ -f app/build/reports/lint-results-debug.html ]; then
            cp app/build/reports/lint-results-debug.html ci-artifacts/reports/
          fi

          if [ -d app/build/reports/tests ]; then
            cp -R app/build/reports/tests ci-artifacts/reports/
          fi

          if [ -d app/build/reports/androidTests ]; then
            cp -R app/build/reports/androidTests ci-artifacts/reports/
          fi

          if [ -d app/build/outputs/androidTest-results ]; then
            cp -R app/build/outputs/androidTest-results ci-artifacts/reports/
          fi

      - name: Upload APK, screenshots, UI dumps, logs, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepriva-android-verification
          path: ci-artifacts/**
          if-no-files-found: warn
          retention-days: 14