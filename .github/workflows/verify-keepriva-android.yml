name: Keepriva Android Build and Real Screenshot Verification

on:
  workflow_dispatch:
  push:
    branches:
      - initial_commit

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout initial_commit
        uses: actions/checkout@v4
        with:
          ref: initial_commit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Install Android SDK 36 build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Temporary CI-only edit. It is never committed back to the repository.
      - name: Allow screenshots only in this CI debug build
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/src/main/java/com/example/privatevault/ScreenSecurityManager.java")
          text = p.read_text(encoding="utf-8")

          old_activity = """    public static void protect(Activity activity) {
              if (activity == null) return;
              protectWindow(activity.getWindow());
          """
          new_activity = """    public static void protect(Activity activity) {
              if (activity == null) return;
              // CI visual verification only. This source edit is temporary.
              if (BuildConfig.DEBUG) return;
              protectWindow(activity.getWindow());
          """

          old_dialog = """    public static void protect(Dialog dialog) {
              if (dialog == null) return;
              protectWindow(dialog.getWindow());
          }
          """
          new_dialog = """    public static void protect(Dialog dialog) {
              if (dialog == null) return;
              // CI visual verification only.
              if (BuildConfig.DEBUG) return;
              protectWindow(dialog.getWindow());
          }
          """

          if old_activity not in text:
              raise SystemExit("Could not locate ScreenSecurityManager.protect(Activity)")
          if old_dialog not in text:
              raise SystemExit("Could not locate ScreenSecurityManager.protect(Dialog)")

          text = text.replace(old_activity, new_activity, 1)
          text = text.replace(old_dialog, new_dialog, 1)
          p.write_text(text, encoding="utf-8")

      - name: Verify manifest has no INTERNET permission
        shell: bash
        run: |
          if grep -R --line-number \
              'android.permission.INTERNET' \
              app/src/main/AndroidManifest.xml app/src/main/res 2>/dev/null; then
            echo "ERROR: INTERNET permission found."
            exit 1
          fi
          echo "PASS: no INTERNET permission found."

      - name: Compile, lint, test, and build debug APK
        shell: bash
        run: |
          gradle --version
          gradle \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Create screenshot output directory
        shell: bash
        run: mkdir -p ci-artifacts/screenshots ci-artifacts/ui

      - name: Boot emulator, install app, and capture real screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: |
            set -euxo pipefail

            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb shell monkey \
              -p com.example.privatevault.debug \
              -c android.intent.category.LAUNCHER 1
            sleep 4

            adb exec-out screencap -p \
              > ci-artifacts/screenshots/01-fresh-install-setup.png

            adb shell uiautomator dump /sdcard/keepriva-ui.xml || true
            adb pull /sdcard/keepriva-ui.xml \
              ci-artifacts/ui/01-fresh-install-ui.xml || true

            python3 - <<'PY'
            import re
            import subprocess
            import time
            import xml.etree.ElementTree as ET

            PASSWORD = "KeeprivaTest123"

            def adb(*args, check=True):
                return subprocess.run(
                    ["adb", *args],
                    check=check,
                    text=True,
                    capture_output=True
                )

            def dump():
                adb("shell", "uiautomator", "dump", "/sdcard/window.xml", check=False)
                result = adb("shell", "cat", "/sdcard/window.xml", check=False)
                if not result.stdout.strip():
                    raise RuntimeError("UI hierarchy dump is empty")
                return ET.fromstring(result.stdout)

            def center(bounds):
                nums = [int(x) for x in re.findall(r"\d+", bounds)]
                if len(nums) != 4:
                    raise RuntimeError(f"Unexpected bounds: {bounds}")
                x1, y1, x2, y2 = nums
                return (x1 + x2) // 2, (y1 + y2) // 2

            def tap_node(node):
                x, y = center(node.attrib["bounds"])
                adb("shell", "input", "tap", str(x), str(y))
                time.sleep(0.5)

            root = dump()
            edits = [
                n for n in root.iter("node")
                if n.attrib.get("class") == "android.widget.EditText"
            ]

            if len(edits) < 2:
                raise RuntimeError(
                    f"Expected two password fields on setup screen, found {len(edits)}"
                )

            for node in edits[:2]:
                tap_node(node)
                adb("shell", "input", "text", PASSWORD)
                time.sleep(0.5)

            root = dump()
            create_button = None
            for n in root.iter("node"):
                text = n.attrib.get("text", "")
                if "Create encrypted vault" in text:
                    create_button = n
                    break

            if create_button is None:
                raise RuntimeError("Create encrypted vault button not found")

            tap_node(create_button)
            time.sleep(4)
            PY

            adb exec-out screencap -p \
              > ci-artifacts/screenshots/02-vault-home.png

            adb shell uiautomator dump /sdcard/keepriva-home-ui.xml || true
            adb pull /sdcard/keepriva-home-ui.xml \
              ci-artifacts/ui/02-vault-home-ui.xml || true

            adb shell am force-stop com.example.privatevault.debug
            sleep 1
            adb shell monkey \
              -p com.example.privatevault.debug \
              -c android.intent.category.LAUNCHER 1
            sleep 4

            adb exec-out screencap -p \
              > ci-artifacts/screenshots/03-real-unlock-screen.png

            adb shell uiautomator dump /sdcard/keepriva-unlock-ui.xml || true
            adb pull /sdcard/keepriva-unlock-ui.xml \
              ci-artifacts/ui/03-real-unlock-ui.xml || true

            adb shell dumpsys package com.example.privatevault.debug \
              > ci-artifacts/package-dump.txt

      - name: Copy APK into artifact folder
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts/apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              ci-artifacts/apk/Keepriva-debug.apk
          fi

      - name: Upload APK, screenshots, UI dumps, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepriva-android-verification
          path: |
            ci-artifacts/**
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
