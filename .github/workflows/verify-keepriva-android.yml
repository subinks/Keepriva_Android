name: Keepriva Android Parallel Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0"
  push:
    branches:
      - initial_commit
      - ui_enhancement
      - "ui_eh_ph*"
      - "phase-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    keepriva-android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: >-
    ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  APK_ARTIFACT_NAME: keepriva-apks-${{ github.sha }}

jobs:
  build-apks:
    name: Build APKs once
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36 build components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate CI helper scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/stage-apks.sh
          bash -n scripts/ci/run-instrumentation-batch.sh
          bash -n scripts/ci/run-visual-verification.sh
          python3 -m py_compile scripts/ci/patch-ci-screenshot-protection.py
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/ci/*.sh
          else
            echo "NOTICE: shellcheck is unavailable on this runner."
          fi

      - name: Apply disposable debug screenshot patch
        shell: bash
        run: python3 scripts/ci/patch-ci-screenshot-protection.py

      - name: Verify manifest has no INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number \
              'android.permission.INTERNET' \
              app/src/main/AndroidManifest.xml app/src/main/res 2>/dev/null; then
            echo "ERROR: INTERNET permission found."
            exit 1
          fi
          echo "PASS: no INTERNET permission found."

      - name: Compile, lint, unit test, and build APKs
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            --stacktrace

      - name: Stage immutable APK bundle and checksums
        shell: bash
        run: bash scripts/ci/stage-apks.sh

      - name: Upload APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ci-apks/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint and JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  instrumentation:
    name: Instrumentation - ${{ matrix.id }}
    needs: build-apks
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: auth-lifecycle-smoke
            classes: >-
              com.example.privatevault.KeeprivaAuthHomeTest,
              com.example.privatevault.KeeprivaLifecycleRobustnessTest,
              com.example.privatevault.KeeprivaUiSmokeTest
          - id: categories
            classes: >-
              com.example.privatevault.KeeprivaCategoryPreferencesTest,
              com.example.privatevault.KeeprivaCategoryDeletionTest
          - id: item-core
            classes: com.example.privatevault.KeeprivaItemCrudTest
          - id: data-transfer
            classes: com.example.privatevault.KeeprivaDataTransferTest
          - id: security
            classes: com.example.privatevault.KeeprivaSecuritySettingsTest

    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android tooling
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download immutable APK bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ci-apks

      - name: Verify downloaded APK checksums
        shell: bash
        run: cd ci-apks && sha256sum --check SHA256SUMS

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Boot emulator and run isolated batch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 180
          emulator-options: >-
            -no-window
            -no-snapshot
            -wipe-data
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: >-
            bash scripts/ci/run-instrumentation-batch.sh
            "${{ matrix.id }}"
            "${{ matrix.classes }}"

      - name: Upload batch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-${{ matrix.id }}-${{ github.sha }}
          path: ci-artifacts/${{ matrix.id }}/**
          if-no-files-found: warn
          retention-days: 14

  visual-verification:
    name: Visual verification and biometric diagnostic
    needs: build-apks
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android tooling
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download immutable APK bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ci-apks

      - name: Verify downloaded APK checksums
        shell: bash
        run: cd ci-apks && sha256sum --check SHA256SUMS

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Boot emulator and capture deterministic screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 180
          emulator-options: >-
            -no-window
            -no-snapshot
            -wipe-data
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: bash scripts/ci/run-visual-verification.sh

      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-verification-${{ github.sha }}
          path: ci-artifacts/visual/**
          if-no-files-found: warn
          retention-days: 14

  serial-safety-net:
    name: Full serial safety net
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: build-apks
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android tooling
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download immutable APK bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ci-apks

      - name: Verify downloaded APK checksums
        shell: bash
        run: cd ci-apks && sha256sum --check SHA256SUMS

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Boot emulator and run all blocking tests serially
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 180
          emulator-options: >-
            -no-window
            -no-snapshot
            -wipe-data
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: >-
            bash scripts/ci/run-instrumentation-batch.sh
            "serial-safety-net"
            "com.example.privatevault.KeeprivaAuthHomeTest,com.example.privatevault.KeeprivaLifecycleRobustnessTest,com.example.privatevault.KeeprivaUiSmokeTest,com.example.privatevault.KeeprivaCategoryPreferencesTest,com.example.privatevault.KeeprivaCategoryDeletionTest,com.example.privatevault.KeeprivaItemCrudTest,com.example.privatevault.KeeprivaDataTransferTest,com.example.privatevault.KeeprivaSecuritySettingsTest"

      - name: Upload serial safety-net diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-safety-net-${{ github.sha }}
          path: ci-artifacts/serial-safety-net/**
          if-no-files-found: warn
          retention-days: 14

  verification-gate:
    name: Verification gate
    if: always()
    needs:
      - build-apks
      - instrumentation
      - visual-verification
      - serial-safety-net
    runs-on: ubuntu-latest

    steps:
      - name: Enforce complete verification result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-apks.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
          VISUAL_RESULT: ${{ needs.visual-verification.result }}
          SERIAL_RESULT: ${{ needs.serial-safety-net.result }}
        run: |
          set -euo pipefail
          echo "build-apks=$BUILD_RESULT"
          echo "instrumentation=$INSTRUMENTATION_RESULT"
          echo "visual-verification=$VISUAL_RESULT"
          echo "serial-safety-net=$SERIAL_RESULT"
          test "$BUILD_RESULT" = "success"
          test "$INSTRUMENTATION_RESULT" = "success"
          test "$VISUAL_RESULT" = "success"
          test "$SERIAL_RESULT" = "success" || test "$SERIAL_RESULT" = "skipped"
